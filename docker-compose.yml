services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_berisso
    ports:
      - "5678:5678"
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://footbath-darkish-unelected.ngrok-free.dev
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - ~/.n8n:/home/node/.n8n
    restart: unless-stopped
